<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison Elsymar</title>
  <meta name="description" content="Facebook et Instagram de Maison Elsymar, en un seul lien.">
  <meta property="og:title" content="Maison Elsymar">
  <meta property="og:description" content="Retrouvez Maison Elsymar sur Facebook et Instagram.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1612;
      --muted: #6d645b;
      --paper: #f4efe8;
      --card: #fffcf8;
      --line: #e4dcd2;
      --fb: #1877f2;
      --ig: #c13584;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at top, #fff 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: Outfit, sans-serif;
    }

    main {
      width: min(420px, 100%);
      text-align: center;
    }

    p.eyebrow {
      margin: 0 0 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(46px, 12vw, 64px);
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    h1 span {
      display: block;
      font-style: italic;
      font-weight: 500;
    }

    .rule {
      width: 48px;
      height: 1px;
      margin: 22px auto 18px;
      background: var(--ink);
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    a.network {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    a.network:hover,
    a.network:focus-visible {
      transform: translateY(-1px);
      border-color: #c9bfb4;
      outline: none;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
      color: white;
    }

    .mark.fb { background: var(--fb); }
    .mark.ig {
      background: radial-gradient(circle at 30% 110%, #fccc63, transparent 42%),
                  radial-gradient(circle at 110% 10%, #7c3aed, transparent 40%),
                  linear-gradient(135deg, #f77737, #c13584 55%, #405de6);
    }

    .copy {
      text-align: left;
      min-width: 0;
    }

    .copy strong {
      display: block;
      font-size: 16px;
      font-weight: 500;
    }

    .copy small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .arrow {
      margin-left: auto;
      color: #b3a89d;
      font-size: 20px;
    }

    footer {
      margin-top: 28px;
      color: #9a9086;
      font-size: 12px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Réseaux</p>
    <h1>Maison <span>Elsymar</span></h1>
    <div class="rule"></div>
    <p class="lead">Un seul lien pour nous suivre sur Facebook et Instagram.</p>
    <nav class="links" aria-label="Réseaux sociaux">
      <a class="network" href="https://www.facebook.com/MaisonElsymar">
        <span class="mark fb" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14.5 8.5V6.8c0-.7.5-1 1.2-1H17V3h-2.1C12.2 3 11 4.4 11 6.6v1.9H9v2.7h2V21h3.5v-9.8h2.3l.4-2.7h-2.7z"/>
          </svg>
        </span>
        <span class="copy">
          <strong>Facebook</strong>
          <small>Maison Elsymar</small>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="network" href="https://www.instagram.com/maison_elsymar/">
        <span class="mark ig" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="4" width="16" height="16" rx="5"/>
            <circle cx="12" cy="12" r="3.6"/>
            <circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="copy">
          <strong>Instagram</strong>
          <small>@maison_elsymar</small>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
    <footer>Maison Elsymar</footer>
  </main>
</body>
</html>
